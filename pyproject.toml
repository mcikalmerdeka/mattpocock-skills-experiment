[project]
name = "doc-qa"
version = "0.1.0"
description = "Doc QA: a local, ChatGPT-style web app that answers Queries from your TXT & Markdown Documents."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.2.3",
    "streamlit>=1.63.0",
]

[project.scripts]
doc-qa = "doc_qa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
