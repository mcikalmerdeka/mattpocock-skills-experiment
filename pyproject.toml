[project]
name = "doc-qa"
version = "0.1.0"
description = "Doc QA: a local, ChatGPT-style web app that answers Queries from your TXT & Markdown Documents."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # The LangChain stack: model calls (ChatOpenAI), embeddings
    # (OpenAIEmbeddings), and the vector store (Chroma) all go through
    # LangChain — the raw `openai` client is no longer used directly, and
    # `chromadb` only remains as an explicit floor: Python 3.14 support
    # (pydantic v1 compat removal) first shipped in chromadb 1.5.5, while
    # langchain-chroma's own floor predates it.
    "langchain-chroma",
    "langchain-openai",
    "langchain-text-splitters",
    "chromadb",
    "python-dotenv",
    "streamlit",
]

[project.scripts]
doc-qa = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest",
]
